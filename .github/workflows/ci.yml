name: Jyaano CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Application and Functions verification
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Verify Jyaano
        run: npm run verify

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Verify Firebase Functions
        working-directory: functions
        run: npm run verify
